name: Build dev container images

# Add concurrency configuration to handle multiple pushes
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

on:
  # Fork note (SpencerGraffunder/birdnet-go, 2026-11-23): the inherited
  # `schedule: cron 0 2 * * *` was removed. The `dev` job gate below already
  # excludes schedule events, so the nightly never built anything — it only
  # added an empty run to the repo every day, which is usage the fork gets
  # counted for. Re-add it if upstream ever makes the cron meaningful.
  workflow_dispatch:
    inputs:
      channel:
        description: "Image channel: dev (:dev, for main) or testing (:testing, a branch build handed to users for testing)"
        required: false
        type: choice
        options:
          - dev
          - testing
        default: dev
  push:
    paths-ignore:
      # The image is built from the Dockerfile, which provisions its own ONNX /
      # TFLite / OpenVINO libraries. Editing CI plumbing (workflows, composite
      # actions, helper scripts) or docs must not burn a multi-arch image build.
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "**.md"
    branches:
      # Only run on push to main branch
      - main

permissions:
  contents: read
  packages: write

jobs:
  # Publish the :dev / :<sha> multi-arch images through the shared reusable
  # workflow (dev strategy), so dev, nightly, and release all build and tag the
  # same way. Dev builds go to GHCR only (no Docker Hub) and skip the Podman
  # validation and cleanup jobs. Runs on push-to-main (the normal path) and on a
  # manual workflow_dispatch (used to cut a draft image for pre-release upgrade
  # QA without moving :nightly/:latest). The scheduled cron stays a no-op by
  # omission from this gate.
  dev:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker-build-push.yml
    with:
      # Push events carry no inputs, so they fall back to dev.
      tag-strategy: ${{ inputs.channel || 'dev' }}
      version: ${{ github.sha }}
      create-latest-tag: false
      platforms: '["linux/amd64", "linux/arm64"]'
      push-to-ghcr: true
      push-to-dockerhub: false
      cleanup-old-images: false
      validate-podman: false
    secrets: inherit
